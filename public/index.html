<head>

<title>Salin Kuwento</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

html{
    scroll-behavior:smooth;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Libre Baskerville', serif;

background-image:
    linear-gradient(rgba(0,0,0,0.20), rgba(0,0,0,0.20)),
    url('star.png');

    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    background-repeat:no-repeat;

    overflow-x:hidden;
    min-height:100vh;
}

/* TABLE */
.table{
    min-height:100vh;
    padding:50px;
}

/* TITLE */
.title{
    text-align:center;
    color:white;
    font-size:4rem;
    margin-bottom:15px;
    font-family:'Cinzel', serif;
    text-shadow:3px 3px 15px rgba(0,0,0,0.8);
    animation:fadeDown 1s ease;
}

/* LOGO ANIMATION */
.title img{
    display:block;
    margin:0 auto;
    max-width:420px;
    width:80%;
    height:auto;

    animation:
    logoFloat 4s ease-in-out infinite,
    logoGlow 3s ease-in-out infinite;

    filter:drop-shadow(0 0 15px rgba(255,255,255,0.25));

    transition:0.4s;
}

/* FLOATING EFFECT */
@keyframes logoFloat{
    0%{
        transform:translateY(0px) scale(1);
    }

    50%{
        transform:translateY(-10px) scale(1.02);
    }

    100%{
        transform:translateY(0px) scale(1);
    }
}

/* GLOW EFFECT */
@keyframes logoGlow{
    0%{
        filter:drop-shadow(0 0 10px rgba(255,255,255,0.15));
    }

    50%{
        filter:drop-shadow(0 0 25px rgba(255,255,255,0.4));
    }

    100%{
        filter:drop-shadow(0 0 10px rgba(255,255,255,0.15));
    }
}

/* HOVER EFFECT */
.title img:hover{
    transform:scale(1.05);
}

.subtitle{
    text-align:center;
    color:#f2e6d0;
    margin-bottom:60px;
    font-size:1.1rem;
    animation:fadeUp 1s ease;
}

@keyframes fadeDown{
    from{
        opacity:0;
        transform:translateY(-30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* BOOK AREA */
.bookshelf{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:60px;
}

/* BOOK */
.book{
    width:210px;
    height:320px;
    position:relative;
    cursor:pointer;
    transform-style:preserve-3d;
    transition:0.5s;
    animation:float 4s ease-in-out infinite;
}

.book:hover{
    transform:
    translateY(-15px)
    rotate(-4deg)
    scale(1.05);

    box-shadow:0 0 30px rgba(255,255,255,0.25);
}

.book-cover{
    width:100%;
    height:100%;
    border-radius:10px;
    overflow:hidden;
    position:relative;

    box-shadow:
    10px 15px 35px rgba(0,0,0,0.7);
}

.book-cover img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:0.4s;
}

.book:hover img{
    transform:scale(1.08);
}

/* SHINE EFFECT */
.book-cover::after{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:60%;
    height:100%;
    background:rgba(255,255,255,0.3);
    transform:skewX(-20deg);
    transition:0.8s;
}

.book:hover .book-cover::after{
    left:140%;
}

/* Base Style (Desktop) */
.logo-img {
    display: block;
    margin: 0 auto;
    width: 900px; /* Or whatever size you want on desktop */
    max-width: 300%; /* Safety net to prevent overflow */
    height: auto;
}

/* DESKTOP VIEW: Forces the logo to be big and wide across the screen */
.main-logo {
    display: block;
    margin: 0 auto 20px auto;
    
    /* Using Viewport Width (vw) forces it to look huge on wide screens */
    width: 65vw; 
    
    /* Sets boundaries so it doesn't get ridiculously massive on giant monitors */
    min-width: 800px;
    max-width: 1400px; 
    
    height: auto;
}

/* MOBILE VIEW: Keeps it perfectly fitted for small smartphone screens */
@media (max-width: 900px) {
    .main-logo {
        /* On phones, drop the large min-width and let it fill the screen naturally */
        width: 85%;
        min-width: 0;
        max-width: 450px;
        margin-bottom: 10px;
    }
}

/* BOOK TITLE */
.book-title{
    text-align:center;
    margin-top:15px;
    color:white;
    font-size:1rem;
    text-shadow:2px 2px 5px rgba(0,0,0,0.7);
}

/* READER */
.reader{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.4);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
    padding:20px;
    animation:fadeIn 0.5s ease;
}

.reader.active{
    display:flex;
}

@keyframes fadeIn{
    from{
        opacity:0;
    }
    to{
        opacity:1;
    }
}

/* OPEN BOOK */
.open-book{
    width:95%;
    max-width:1200px;
    height:85vh;
    background:#f6ecd2;
    border-radius:15px;
    overflow:hidden;
    display:flex;
    position:relative;

    box-shadow:0 0 50px rgba(0,0,0,0.7);

    animation:openBook 0.6s ease;
}

@keyframes openBook{
    from{
        transform:scale(0.5) rotateY(90deg);
        opacity:0;
    }
    to{
        transform:scale(1) rotateY(0deg);
        opacity:1;
    }
}

/* PAGES */
.page {
    /* Remove width: 50%; from here so we can set custom widths below */
    padding: 50px;
    overflow-y: auto;
    line-height: 2;
    position: relative;
    font-size: 1.05rem;
}

.left-page {
    width: 65%; 
    border-right: 2px solid #d4c3a3;
    background:#fffaf0;
}

.right-page {
    width: 65%; 
    background:#fdf6e3;
}

/* BUTTONS */
.controls{
    position:absolute;
    top:20px;
    right:20px;
    display:flex;
    gap:10px;
    z-index:10;
}

button{
    border:none;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    background:#5a3825;
    color:white;
    transition:0.3s;
    font-size:14px;
}

button:hover{
    background:#7c5338;
    transform:scale(1.05);
}
 
.close-btn{
    background:#8b1e1e;
}

/* ANNOTATIONS */
.annotation{
    color:#1f4c7a;
    cursor:pointer;
    position:relative;
    border-bottom:2px dotted #1f4c7a;
    font-weight:bold;
}

.note{
    position:absolute;
    bottom:140%;
    left:50%;
    transform:translateX(-50%);
    width:240px;
    background:#222;
    color:white;
    padding:12px;
    border-radius:8px;
    font-size:0.9rem;
    line-height:1.5;
    visibility:hidden;
    opacity:0;
    transition:0.3s;
    z-index:100;
}

.annotation:hover .note,
.annotation:focus .note{
    visibility:visible;
    opacity:1;
}

/* SCROLLBAR */
.page::-webkit-scrollbar{
    width:8px;
}

.page::-webkit-scrollbar-thumb{
    background:#b89b72;
    border-radius:10px;
}

/* ACCESSIBILITY */
button:focus,
.annotation:focus{
    outline:3px solid gold;
}


/* --- RESPONSIVE MOBILE OPTIMIZATIONS --- */
@media(max-width:900px){
    /* 1. Main Layout & Logo Scale Settings */
    .title {
        font-size: clamp(1.5rem, 8vw, 2.5rem);
        padding: 0 15px;
    }
    
    .main-logo {
        width: 85%;
        min-width: 0;
        max-width: 450px;
        margin-bottom: 10px;
    }
    
    .subtitle {
        margin-bottom: 40px;
        padding: 0 20px;
        font-size: 0.95rem;
    }

    /* 🚨 BOOKSHELF & BOOK IMAGES FIX: Adjusts covers so they don't look huge or overflow on mobile */
  /* 📱 BALANCED & PERFECTLY CENTERED MOBILE BOOKSHELF */
    .bookshelf {
        display: flex;
        flex-direction: column; 
        align-items: center;    /* Keeps everything perfectly aligned in the screen center */
        gap: 35px;             
        padding: 0 20px 40px 20px;
        width: 100%;
        box-sizing: border-box;
    }

    .book {
        width: 60vw;           /* Slightly narrower so it doesn't feel overwhelming */
        max-width: 230px;      /* Clamps it perfectly so it looks clean on all phones */
        height: auto;          
        aspect-ratio: 210 / 320; /* Dynamically preserves your exact book proportions */
        margin: 0 auto;        /* Hard center alignment */
        display: block;
    }

    /* 🚨 FORCE THE COVER AND INNER IMAGE TO FIT FLUSH AND CENTERED */
    .book-cover {
        width: 100% !important;
        height: 100% !important;
        border-radius: 10px;
        overflow: hidden;
    }

    .book-cover img {
        width: 100% !important;
        height: 100% !important;
        object-fit: cover;     /* Keeps the image filling the frame cleanly without distortion */
        display: block;
    }

    /* Clean, legible, centered title styling */
    .book-title {
        font-size: 1.05rem;
        text-align: center;
        margin-top: 12px;
        color: white;
        width: 100%;
        display: block;
    }
    
    .book:hover {
        transform: translateY(-5px) scale(1.02); /* Less dramatic movement for touch screens */
    }

    /* 2. Reader Lightbox Container View */
    .reader {
        padding: 10px;
    }

    .open-book {
        flex-direction: column;
        height: 85vh; /* Prevents browser address bar clipping */
        width: 100%;
        padding-top: 60px;
    }

    /* Sticky Action Header & Tab bar layout adjustments */
    .controls {
        width: 100%;
        top: 0;
        left: 0;
        right: 0;
        background: #5a3825;
        padding: 10px;
        justify-content: flex-end;
        border-radius: 15px 15px 0 0;
    }

    .controls button {
        padding: 8px 14px;
        font-size: 13px;
    }

    .mobile-tabs {
        display: flex;
        position: absolute;
        top: 60px;
        left: 0;
        z-index: 5;
    }

    /* 3. Text and Image Fit Control System inside Pages */
    .page {
        width: 100% !important;
        height: calc(100% - 110px) !important; 
        position: absolute;
        top: 110px;
        left: 0;
        padding: 20px 25px;
        font-size: 0.95rem; 
        line-height: 1.7;    
        display: none;       
        overflow-x: hidden;  
        word-wrap: break-word; 
    }

    .page img {
        width: 100% !important;      /* Lets it dynamically stretch across the text column */
        max-width: 100% !important;  /* Safety barrier: stops it from expanding past the page margins */
        min-width: 0 !important;     /* Disables previous micro shrinking limits */
        height: auto !important;     /* Keeps aspect proportions completely locked and crisp */
        display: block;
        margin: 20px auto;           /* Generous vertical spacing separating it from text rows */
        border-radius: 8px;          /* Clean, slightly soft image corners */
        object-fit: contain;
    }

    .left-page.active-mobile-page,
    .right-page.active-mobile-page {
        display: block;
    }

    .left-page {
        border-right: none;
    }
    
    /* 4. Touch-Safe Absolute Annotations */
    .note {
        position: fixed;
        bottom: 20px;
        left: 5%;
        right: 5%;
        width: 90%;
        transform: none;
    }
}

}

</style>
</head>

<div class="table">

<h1 class="title">

</h1>
            
    <p class="subtitle">

An Interactive Collection of Translated Short Stories Connecting the Global South and the Global North

         <div class="book" onclick="openBook('butterfly')">

</div>

<div class="reader" id="reader">

            <button class="close-btn" onclick="closeBook()">Close</button>

</div>

<script>

const reader = document.getElementById("reader");

function openBook(book){

    reader.classList.add("active");

    if(book === "matchgirl"){
        loadMatchGirl();
    }

    if(book === "princess"){
        loadPrincess();
    }

    if(book === "butterfly"){
        loadButterfly();
    }
}

function closeBook(){
    reader.classList.remove("active");
}

function showOriginal(){
    document.getElementById("originalPage").style.display = "block";
    document.getElementById("translatedPage").style.display = "none";
}

function showTranslation(){
    document.getElementById("originalPage").style.display = "none";
    document.getElementById("translatedPage").style.display = "block";
}

/* STORY 1 */

function loadMatchGirl(){

document.getElementById("originalPage").innerHTML = `
<h1>The Gift of the Magi</h1>
<h5>by O. Henry</h5>

<p>One dollar and eighty-seven cents.</p>

<p>That was all. She had put it aside, one cent and then another and then another, in her careful buying of meat and other food. Della counted it three times. One dollar and eighty-seven cents. And the next day would be Christmas.</p>
<div style="text-align: center; margin: 20px 0;">
    <img src="coins.jpg" alt="barya" width="500">
</div>
<p>There was nothing to do but fall on the bed and cry. So Della did it. While the lady of the home is slowly growing quieter, we can look at the home. 
    <span class="annotation" tabindex="0">
        Furnished
        <span class="note">“Furnished” means a room that already has furniture like beds, tables, and chairs.</span>
    </span> 
    rooms at a cost of $8 a week. There is little more to say about it. In the hall below was a letter-box too small to hold a letter. There was an electric bell, but it could not make a sound. Also there was a name beside the door: “Mr. James Dillingham Young.”</p>

<p>When the name was placed there, Mr. James Dillingham Young was being paid $30 a week. Now, when he was being paid only $20 a week, the name seemed too long and important. It should perhaps have been “Mr. James D. Young.” But when Mr. James Dillingham Young entered the furnished rooms, his name became very short indeed. Mrs. James Dillingham Young put her arms warmly about him and called him “Jim.” You have already met her.</p>

<p>She is Della. Della finished her crying and cleaned the marks of it from her face. She stood by the window and looked out with no interest. Tomorrow would be Christmas Day, and she had only $1.87 with which to buy Jim a gift. She had put aside as much as she could for months, with this result. Twenty dollars a week is not much. Everything had cost more than she had expected. It always happened like that.</p>
<div style="text-align: center; margin: 20px 0;">
    <img src="window.png" alt="window" width="500">
</div>
<p>Only $1.87 to buy a gift for Jim. Her Jim. She had had many happy hours planning something nice for him. Something nearly good enough.</p>

<p>Something almost worth the honor of belonging to Jim. There was a 
    <span class="annotation" tabindex="0">
        looking-glass
        <span class="note">A mirror.</span>
    </span> 
    between the windows of the room. Perhaps you have seen the kind of looking-glass that is placed in $8 furnished rooms. It was very narrow. A person could see only a little of himself at a time. However, if he was very thin and moved very quickly, he might be able to get a good view of himself. Della, being quite thin, had 
    <span class="annotation" tabindex="0">
        mastered
        <span class="note">Learned how to do something perfectly.</span>
    </span> 
    this art. Suddenly she turned from the window and stood before the glass. Her eyes were shining brightly, but her face had lost its color. Quickly she pulled down her hair and let it fall to its complete length. The James Dillingham Youngs were very proud of two things which they owned. One thing was Jim’s gold 
    <span class="annotation" tabindex="0">
        watch
        <span class="note">A small clock that you wear or carry in your pocket to tell the time.</span>
    </span>. 
    It had once belonged to his father. And, long ago, it had belonged to his father’s father. The other thing was Della’s hair. If a queen had lived in the rooms near theirs, Della would have washed and dried her hair where the queen could see it. Della knew her hair was more beautiful than any queen’s jewels and gifts.</p>

<p>If a king had lived in the same house, with all his riches, Jim would have looked at his watch every time they met.</p>

<p>Jim knew that no king had anything so 
    <span class="annotation" tabindex="0">
        valuable
        <span class="note">Worth a lot of money, or having great importance.</span>
    </span>.</p>

<p>So now Della’s beautiful hair fell about her, shining like a falling stream of brown water. It reached below her knee. It almost made itself into a dress for her. And then she put it up on her head again, nervously and quickly. Once she stopped for a moment and stood still while a tear or two ran down her face. She put on her old brown coat. She put on her old brown hat.</p>

<p>With the bright light still in her eyes, she moved quickly out the door and down to the street.</p>
<div style="text-align: center; margin: 20px 0;">
    <img src="outside.png" alt="outside" width="500">
</div>
<p>Where she stopped, the sign said: “Mrs. Sofronie. Hair Articles of all Kinds.”</p>

<p>Up to the second floor Della ran, and stopped to get her breath. Mrs. Sofronie, large, too white, cold-eyed, looked at her.</p>

<p>“Will you buy my hair?” asked Della.</p>

<p>“I buy hair,” said Mrs. Sofronie.</p>

<p>“Take your hat off and let me look at it.”</p>

<p>Down fell the brown waterfall.</p>

<p>“Twenty dollars,” said Mrs. Sofronie, lifting the hair to feel its weight.</p>

<p>“Give it to me quick,” said Della.</p>
<div style="text-align: center; margin: 20px 0;">
    <img src="hair.png" alt="hair" width="500">
</div>
<p>Oh, and the next two hours seemed to fly. She was going from one shop to another, to find a gift for Jim.</p>

<p>She found it at last. It surely had been made for Jim and no one else. There was no other like it in any of the shops, and she had looked in every shop in the city. It was a gold watch chain, very simply made. Its value was in its rich and pure 
    <span class="annotation" tabindex="0">
        material
        <span class="note">The physical substance things are made of (in this case, gold).</span>
    </span>. 
    Because it was so plain and simple, you knew that it was very valuable. All good things are like this.</p>

<p>It was good enough for The Watch.</p>

<p>As soon as she saw it, she knew that Jim must have it. It was like him. Quietness and value—Jim and the chain both had quietness and value. She paid twenty-one dollars for it. And she hurried home with the chain and eighty-seven cents.</p>

<p>With that chain on his watch, Jim could look at his watch and learn the time anywhere he might be. Though the watch was so fine, it had never had a fine chain. He sometimes took it out and looked at it only when no one could see him do it. When Della arrived home, her mind quieted a little. She began to think more 
    <span class="annotation" tabindex="0">
        reasonably
        <span class="note">Using good sense and sound judgment.</span>
    </span>. 
    She started to try to cover the sad marks of what she had done.</p>
<div style="text-align: center; margin: 20px 0;">
    <img src="watch.png" alt="watch" width="500">
</div>
<p>Love and large-hearted giving, when added together, can leave deep marks. It is never easy to cover these marks, dear friends—never easy. Within forty minutes her head looked a little better. With her short hair, she looked wonderfully like a schoolboy. She stood at the looking-glass for a long time.</p>

<p>“If Jim doesn’t kill me,” she said to herself, “before he looks at me a second time, he'll say I look like a girl who sings and dances for money. But what could I do—oh! What could I do with a dollar and eighty-seven cents?”</p>

<p>At seven, Jim’s dinner was ready for him.</p>
<div style="text-align: center; margin: 20px 0;">
    <img src="mirror.png" alt="mirror" width="500">
</div>
<p>Jim was never late. Della held the watch chain in her hand and sat near the door where he always entered. Then she heard his step in the hall and her face lost color for a moment. She often said little prayers quietly, about simple everyday things. And now she said: “Please God, make him think I’m still pretty.”</p>
<div style="text-align: center; margin: 20px 0;">
    <img src="jim.png" alt="jim" width="500">
</div>
<p>The door opened and Jim stepped in. He looked very thin and he was not smiling. Poor fellow, he was only twenty-two—and with a family to take care of! He needed a new coat and he had nothing to cover his cold hands. Jim stopped inside the door. He was as quiet as a hunting dog when it is near a bird. His eyes looked strangely at Della, and there was an 
    <span class="annotation" tabindex="0">
        expression
        <span class="note">The look on someone's face that shows their feelings.</span>
    </span> 
    in them that she could not understand. It filled her with fear.</p>

<p>It was not anger, nor surprise, nor anything she had been ready for. He simply looked at her with that strange expression on his face. Della went to him.</p>

<p>“Jim, dear,” she cried, “don’t look at me like that. I had my hair cut off and sold it. I couldn’t live through Christmas without giving you a gift. My hair will grow again. You won’t care, will you? My hair grows very fast. It’s Christmas, Jim. Let’s be happy. You don’t know what a nice—what a beautiful nice gift I got for you.”</p>

<p>“You’ve cut off your hair?” asked Jim slowly. He seemed to 
    <span class="annotation" tabindex="0">
        labor
        <span class="note">To work very hard or struggle to do something.</span>
    </span> 
    to understand what had happened. He seemed not to feel sure he knew.</p>

<p>“Cut it off and sold it,” said Della. “Don’t you like me now? I’m me, Jim. I’m the same without my hair.”</p>

<p>Jim looked around the room.</p>

<p>“You say your hair is gone?” he said.</p>

<p>“You don’t have to look for it,” said Della. “It’s sold, I tell you—sold and gone, too. It’s the night before Christmas, boy. Be good to me, because I sold it for you. Maybe the hairs of my head could be counted,” she said, “but no one could ever count my love for you. Shall we eat dinner, Jim?”</p>

<p>Jim put his arms around his Della. For ten seconds let us look in another direction. Eight dollars a week or a million dollars a year—how different are they? Someone may give you an answer, but it will be wrong. The 
    <span class="annotation" tabindex="0">
        magi
        <span class="note">Wise men; historically, the three wise men who brought gifts to the baby Jesus.</span>
    </span> 
    brought valuable gifts, but that was not among them. My meaning will be explained soon.</p>
<div style="text-align: center; margin: 20px 0;">
    <img src="hug.png" alt="hug" width="500">
</div>
<p>From inside the coat, Jim took something tied in paper. He threw it upon the table.</p>

<p>“I want you to understand me, Della,” he said. “Nothing like a haircut could make me love you any less. But if you’ll open that, you may know what I felt when I came in.”</p>

<div style="text-align: center; margin: 20px 0;">
    <img src="comb.png" alt="combs" width="500">
</div>
<p>White fingers pulled off the paper. And then a cry of joy; and then a change to tears.</p>

<p>For there lay The 
    <span class="annotation" tabindex="0">
        Combs
        <span class="note">Toothed tools used here as decorative hair accessories to hold hair in place.</span>

<p>But she held them to her heart, and at last was able to look up and say: “My hair grows so fast, Jim!”</p>

<div style="text-align: center; margin: 20px 0;">

</div>
<p>Jim sat down and smiled.</p>

<p>“Della,” said he, “let’s put our Christmas gifts away and keep them a while. They’re too nice to use now. I sold the watch to get the money to buy the combs. And now I think we should have our dinner.”</p>
<div style="text-align: center; margin: 20px 0;">

</div>
<p>The magi, as you know, were wise men—wonderfully wise men—who brought gifts to the newborn Christ-child. They were the first to give Christmas gifts. Being wise, their gifts were 
    <span class="annotation" tabindex="0">

<p>Everywhere they are the wise ones.</p>

<p>They are the magi.</p>

<h1>Ang Regalo ng mga Mago</h1>
<h5>ni O. Henry</h5>

<p>Isang dolyar at pitumpu't pitong sentimos.</p>

<p>Iyon lang. Ipinagtabi niya iyon, isang sentimos nang isang sentimos, sa maingat na pagbili ng karne at iba pang pagkain. Tiningnan ni Della nang tatlong beses. Isang dolyar at pitumpu't pitong sentimos. At kinabukasan ay Pasko na.</p>

<p>Nang ilagay doon ang pangalan, si Mr. James Dillingham Young ay sumusuweldo ng $30 isang linggo. Ngayon, na sumusuweldo na lamang siya ng $20 isang linggo, masyado nang mahaba at mahalaga ang pangalan. Marahil ay dapat na "Mr. James D. Young." Pero nang pumasok si Mr. James Dillingham Young sa mga silid na may kasangkapan, naging napakaikli ng kanyang pangalan. Yumakap ang Mrs. James Dillingham Young ng mahigpit sa kanya at tinawag siyang "Jim." Nakilala mo na siya. Siya si Della.</p>

<p>Natapos na ang pag-iyak ni Della at nilinis ang mga

<div style="text-align: center; margin: 20px 0;">
    <img src="window.png" alt="window" width="500">
</div>
<p>Lamang na $1.87 para bilhan ng regalo si Jim. Ang Jim niya. Marami siyang masasayang oras na inilalaan sa pagpaplano ng isang magandang bagay para sa kanya. Isang bagay na halos sapat na. Isang bagay na halos karapat-dapat sa karangalan na pag-aari ni Jim.</p>

<p>May salamin sa pagitan ng mga bintana ng silid. Marahil ay nakita mo na ang uri ng salamin na inilalagay sa mga silid na $8 isang linggo. Napakaipot nito. Kaunting bahagi lamang ng sarili ang makikita ng isang tao sa isang pagkakataon. Gayunpaman, kung siya ay napakapayat at gumagalaw ng napakabilis, maaaring makakuha siya ng magandang tanawin ng kanyang sarili. Si Della, na medyo payat, ay 
    <span class="annotation" tabindex="0">
        nahasa
        <span class="note">Naging sanay, magaling, o bihasa sa isang gawain (mastered).</span>
    </span> 
    na sa sining na ito.</p>

<p>Bigla siyang tumalikod sa bintana at tumayo sa harap ng salamin. Kumikislap ang kanyang mga mata, pero nawala ang kulay ng kanyang mukha. Mabilis niyang ibinaba ang kanyang buhok at pinabayaang bumagsak sa buong haba nito.</p>

<p>Ang mga James Dillingham Young ay labis na ipinagmamalaki ang dalawang bagay na pag-aari nila. Ang isa ay ang gintong 
    <span class="annotation" tabindex="0">

        <span class="note">Isang maliit na orasan na isinusuot sa pulso o ibinubulsa (watch).</span>

    ni Jim. Naging pag-aari ito ng kanyang ama noon. At, noong matagal na panahon, naging pag-aari ito ng ama ng kanyang ama. Ang isa pang bagay ay ang buhok ni Della. Kung may reyna na nakatira sa mga silid malapit sa kanila, huhugasan at patutuyuin ni Della the kanyang buhok kung saan makikita ito ng reyna. Alam ni Della na ang kanyang buhok ay mas maganda kaysa sa anumang alahas at regalo ng reyna.</p>

<p>Kung may hari na nakatira sa parehong bahay, kasama ang lahat ng kanyang kayamanan, titingnan ni Jim ang kanyang relo sa tuwing magkikita sila. Alam ni Jim na walang hari na may anumang bagay na napakahalaga.</p>

<p>Kaya ngayon, ang magandang buhok ni Della ay bumagsak sa paligid niya, kumikislap na parang bumabagsak na ilog ng kayumangging tubig. Umabot ito sa ibaba ng kanyang tuhod. Halos nagmukha itong damit para sa kanya. At pagkatapos ay inayos niya ulit ito sa kanyang ulo, nerbiyoso at mabilis. Isang beses siyang tumigil saglit at nanatiling nakatayo habang isang luha o dalawa ang tumulo sa kanyang mukha.</p>

<p>Isinuot niya ang kanyang lumang kayumangging kasuotan. Isinuot niya ang kanyang lumang kayumangging sumbrero. May kislap na ilaw pa rin sa kanyang mga mata, mabilis siyang lumabas ng pinto at pababa sa kalye. Kung saan siya tumigil, nakasulat sa

    "Mrs. Sofronie. Lahat ng Uri ng Bagay na Pang-Buhok."</p>
<div style="text-align: center; margin: 20px 0;">
    <img src="outside.png" alt="outside" width="500">
</div>
<p>Pataas sa ikalawang palapag tumakbo si Della, at tumigil para huminga ng malalim. Si Mrs. Sofronie, malaki, masyadong maputi, matang malamig, ay tiningnan siya.</p>

<p>“Bibilhin niyo ba ang buhok ko?” tanong ni Della.</p>

<p>“Bumibili ako ng buhok,” sabi ni Mrs. Sofronie. “Alisin mo ang sumbrero mo at tingnan ko.”</p>

<p>Bumagsak ang kayumangging talon.</p>

<p>“Dalawampung dolyar,” sabi ni Mrs. Sofronie, itinataas ang buhok para damhin ang bigat nito.</p>

<p>“Ibigay niyo agad sa akin,” sabi ni Della.</p>
<div style="text-align: center; margin: 20px 0;">
    <img src="hair.png" alt="hair" width="500">
</div>
<p>At ang susunod na dalawang oras ay parang lumipas nang mabilis. Nagpunta siya sa isang tindahan patungo sa isa, para humanap ng regalo para kay Jim.</p>

<p>Sa huli ay natagpuan niya ito. Tiyak na ginawa ito para kay Jim at wala nang iba. Walang katulad nito sa anumang tindahan, and tiningnan niya ang bawat tindahan sa lungsod. Ito ay isang ginto na kuwintas ng relo, napakasimpleng gawa. Ang halaga nito ay nasa mayaman at 
    <span class="annotation" tabindex="0">
        dalisay
        <span class="note">Walang halo, malinis, o puro (pure).</span>
    </span> 
    na materyal. Dahil napakasimple at plain, alam mong napakahalaga nito. Lahat ng mabubuting bagay ay ganito.</p>

<p>Sapat na ito para sa Relo.</p>

<p>Pagkakita niya, alam niyang dapat ito mapasakay kay Jim. Parang siya. Katahimikan at halaga—parehong may katahimikan at halaga si Jim at ang kuwintas. Binayaran niya ito ng dalawampu't isang dolyar. At nagmadali siyang umuwi kasama ang kuwintas at pitumpu't pitong sentimos.</p>

<p>Sa kuwintas na iyon sa kanyang relo, maaaring tignan ni Jim ang kanyang relo at malaman ang oras kahit saan siya naroroon. Bagama't napakaganda ng relo, hindi pa ito nagkaroon ng magandang kuwintas. Minsan ay inilalabas niya ito at tinitingnan lamang kapag walang makakakita sa kanya.</p>
<div style="text-align: center; margin: 20px 0;">
    <img src="watch.png" alt="watch" width="500">
</div>
<p>Nang makauwi si Della, kumalma nang kaunti ang kanyang isip. Sinimulan niyang mag-isip nang mas 
    <span class="annotation" tabindex="0">
        makatwiran
        <span class="note">Gumagamit ng tamang pag-iisip, lohika, o katwiran (reasonably).</span>
    </span>. 
    Sinimulan niyang subukang takpan ang malulungkot na bakas ng kanyang nagawa. Ang pag-ibig at ang malawak na pagbibigay, kapag pinagsama, ay maaaring mag-iwan ng malalim na bakas. Hindi kailanman madaling takpan ang mga bakas na ito, mga kaibigan—hindi kailanman madali. Sa loob ng apatnapung minuto ay medyo gumanda ang hitsura ng kanyang ulo. Sa kanyang maikling buhok, kahanga-hanga siyang magmukhang isang batang lalaking estudyante. Matagal siyang tumayo sa salamin.</p>

<p>“Kung hindi ako papatayin ni Jim,” sabi niya sa kanyang sarili, “bago niya ako tingnan ng pangalawang pagkakataon, sasabihin niyang mukha akong babaeng kumakanta at sumasayaw para sa pera. Pero ano ang magagawa ko—oh! Ano ang magagawa ko sa isang dolyar at pitumpu't pitong sentimos?”</p>

<p>Alas-siyete, handa na ang hapunan ni Jim. Hindi kailanman nahuhuli si Jim. Hawak ni Della ang kuwintas ng relo at umupo malapit sa pinto kung saan siya palaging pumapasok. Pagkatapos ay narinig niya ang kanyang mga hakbang sa pasilyo at nawala ang kulay ng kanyang mukha saglit. Madalas siyang tahimik na nagdarasal tungkol sa simpleng pang-araw-araw na bagay. At ngayon ay sinabi niya: “Panginoon, gawin ninyong isipin niya na maganda pa rin ako.”</p>
<div style="text-align: center; margin: 20px 0;">
    <img src="mirror.png" alt="mirror" width="500">
</div>
<p>Bumukas ang pinto at pumasok si Jim. Mukha siyang napakapayat at hindi siya ngingiti. Kawawang tao, dalawampu't dalawa lang siya—and may pamilyang binubuhay! Kailangan niya ng bagong kasuotan at wala siyang anumang panakip sa kanyang malamig na mga kamay. Tumigil si Jim sa loob ng pinto. Tahimik siya na parang asong pang-aso kapag malapit sa ibon. Kakaiba ang tingin ng kanyang mga mata kay Della, at may 
    <span class="annotation" tabindex="0">
        ekspresyon
        <span class="note">Ang hitsura ng mukha na nagpapakita ng damdamin o saloobin (expression).</span>
    </span>

<div style="text-align: center; margin: 20px 0;">
    <img src="jim.png" alt="jim" width="500">
</div>
<p>“Jim, mahal,” sigaw niya, “huwag mo akong tingnan nang ganyan. Pinutol at ipinabenta ko ang buhok ko. Hindi ko makakayanang malampasan ang Pasko nang walang regalong ibibigay sa iyo. Tutubo ulit ang buhok ko. Hindi ka mag-aalala, di ba? Napakabilis tumubo ng buhok ko. Pasko na, Jim. Magsaya tayo. Hindi mo alam kung gaano kaganda—kung gaano kagandang regalo ang nakuha ko para sa iyo.”</p>

<p>“Pinutol mo ang buhok mo?” tanong ni Jim nang dahan-dahan. Parang hirap siyang maunawaan ang nangyari. Parang hindi siya sigurado na alam niya.</p>

<p>“Pinutol at ipinabenta,” sabi ni Della. “Hindi mo ba ako gusto ngayon? Ako pa rin ito, Jim. Ako pa rin ang walang buhok.”</p>

<p>Tumingin sa paligid ng silid si Jim.</p>

<p>“Sabi mo wala na ang buhok mo?” sabi niya.</p>

<p>“Hindi mo na kailangang hanapin,” sabi ni Della. “Ipinabenta ko, sinasabi ko sa iyo—ipinabenta at wala na. Gabing Bago ang Pasko, lalaki. Maging mabuti ka sa edin, dahil ipinabenta ko ito para sa iyo. Marahil ang mga buhok sa aking ulo ay mabibilang,” sabi niya, “pero walang sinuman ang makakabilang sa pag-ibig ko para sa iyo. Kakain ba tayo, Jim?”</p>

<p>Yumakap si Jim sa kanyang Della. Sa loob ng sampung segundo, tingnan natin sa ibang direksyon. Walong dolyar isang linggo o isang milyong dolyar isang taon—gaano ba sila kaiba? Maaaring may magbigay sa iyo ng sagot, pero mali ito. Ang mga 
    <span class="annotation" tabindex="0">

        <span class="note">Mga taong marurunong; partikular ang Tatlong Hari na nag-alay ng regalo kay Hesus (Magi).</span>

    <img src="hug.png" alt="hug" width="500">
</div>
<p>Mula sa loob ng kasuotan, kumuha si Jim ng isang bagay na nakatali sa papel. Ibinato niya ito sa mesa.</p>

<p>“Gusto kong maunawaan mo ako, Della,” sabi niya. “Walang katulad ng pagupit ng buhok ang makapagpapababa ng pagmamahal ko sa iyo. Pero kung bubuksan mo iyan, malalaman mo ang aking naramdaman nang pumasok ako.”</p>
<div style="text-align: center; margin: 20px 0;">
    <img src="comb.png" alt="combs" width="500">
</div>
<p>Binuksan ng mga puting daliri ang papel. At pagkatapos ay isang sigaw ng galak; at pagkatapos ay pagbabago sa luha.</p>

<p>Dahil naroon ang mga Suklay—ang mga
    <span class="annotation" tabindex="0">
        suklay
        <span class="note">Isang kasangkapan na may mga ngipin na ginagamit sa pag-aayos o pagpapakapit ng buhok (combs).</span>
    </span>

<p>Pero inakap niya ang mga ito sa kanyang puso, at sa huli ay nakayanang tumingala at sabihin: “Napakabilis tumubo ng buhok ko, Jim!”</p>

<p>At pagkatapos ay tumalon siya at sumigaw, “Oh, oh!”</p>

<p>Hindi pa nakikita ni Jim ang kanyang magandang regalo. Inilabas niya ito sa kanya sa kanyang bukas na palad. Tila malambot na kumikislap ang ginto, na parang kasama ang kanyang sariling mainit at mapagmahal na diwa.</p>

<p>“Hindi ba ito perpekto, Jim? Hinanap ko sa buong lungsod para mahanap ito. Isang daang beses mo nang titingnan ang relo mo sa isang araw ngayon. Ibigay mo sa akin ang relo mo. Gusto kong makita kung gaano sila kaganda kapag magkasama.”</p>
<div style="text-align: center; margin: 20px 0;">
    <img src="sit.png" alt="sits" width="500">
</div>
<p>Umupo si Jim at ngumiti.</p>

<p>“Della,” sabi niya, “itabi muna natin ang ating mga regalo ng Pasko at ingatan natin nang kaunti. Masyadong maganda para gamitin ngayon. Ipinabenta ko ang relo para makuha ang perang pambili ng mga suklay. At ngayon sa palagay ko ay dapat nating kainin ang ating hapunan.”</p>
<div style="text-align: center; margin: 20px 0;">
    <img src="magi.png" alt="magis" width="500">
</div>
<p>Ang mga mago, ganoon ang alam mo, ay mga taong marurunong—kahanga-hangang mga taong marurunong—na nagdala ng regalo sa bagong panganak na batang Cristo. Sila ang ng unang nagbigay ng mga regalo ng Pasko. Dahil marurunong, ang kanilang mga regalo ay tiyak na marurunong. At dito ay ikinuwento ko sa iyo ang kuwento ng dalawang bata na hindi marurunong. Bawat isa ay ipinabenta ang pinakamahalagang bagay na pag-aari niya para bilhan ng regalo ang isa. Pero hayaan akong magsalita ng huling salita sa mga marurunong ngayon: Sa lahat ng nagbibigay ng regalo, ang dalawang ito ang pinakamarurunong. Sa lahat ng nagbibigay at tumatanggap ng regalo, ang mga tulad nila ang pinakamarurunong.</p>

<p>Sa lahat ng lugar ay sila ang mga marurunong.</p>

<p>Sila ang mga mago.</p>

<script>
(function () {

    // 🎵 Audio elements setup
    let currentAudio = null;
    let isSpeaking = false;

    const speakBtn = document.getElementById("speakBtn");
    if (!speakBtn) return;

    // Detects which page is currently viewable or active
    function isOriginalActive() {
        const originalPage = document.getElementById("originalPage");
        const translatedPage = document.getElementById("translatedPage");

        if (!originalPage || !translatedPage) return true; // Default fallback

        const originalVisible =
            originalPage.offsetParent !== null &&
            getComputedStyle(originalPage).display !== "none";

        const translatedVisible =
            translatedPage.offsetParent !== null &&
            getComputedStyle(translatedPage).display !== "none";

        if (translatedVisible && !originalVisible) return false;
        if (originalVisible && !translatedVisible) return true;

        const isTranslatedActive =
            translatedPage.classList.contains("active") ||
            translatedPage.classList.contains("show") ||
            translatedPage.classList.contains("visible");

        return !isTranslatedActive;
    }

    // Standard function to clean up and reset UI when audio stops
    function resetUI() {
        isSpeaking = false;
        speakBtn.textContent = "🔊 Listen";
        currentAudio = null;
    }

    speakBtn.addEventListener("click", function () {

        // If audio is already playing, stop it
        if (isSpeaking && currentAudio) {
            currentAudio.pause();
            currentAudio.currentTime = 0; // Reset track to beginning
            resetUI();
            return;
        }

        // 🔍 Check which story is currently loaded in the reader
        const originalPage = document.getElementById("originalPage");
        const headingText = originalPage ? originalPage.querySelector("h2").textContent.toLowerCase() : "";
        
        // Check if the current story is "The Gift of the Magi"
        const isGiftOfMagi = headingText.includes("gift") || headingText.includes("magi");

        let audioFile = "";

        if (isGiftOfMagi) {
            // Audio files for The Gift of the Magi
            audioFile = isOriginalActive() 
                ? "TheGiftofTheMagi.mp3" 
                : "Mago.mp3";
        } else {
            // Fallback to your original butterfly audio tracks
            audioFile = isOriginalActive() 
                ? "Butterflies_Original.mp3" 
                : "Mga Paru-paro_Salin.mp3";
        }

        // Create new Audio instance
        currentAudio = new Audio(audioFile);

        // UI Updates based on audio events
        currentAudio.onplay = () => {
            isSpeaking = true;
            speakBtn.textContent = "⏹️ Stop";
        };

        currentAudio.onended = () => {
            resetUI();
        };

        currentAudio.onerror = () => {
            alert("Error: Could not load or play the audio file (" + audioFile + ").");
            resetUI();
        };

        // Play the track
        currentAudio.play().catch(error => {
            console.error("Audio play failed:", error);
            resetUI();
        });
    });

    // Close button logic to stop background audio
    const closeBtn = document.querySelector(".close-btn");
    if (closeBtn) {
        closeBtn.addEventListener("click", () => {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            resetUI();
        });
    }

})();
</script>
